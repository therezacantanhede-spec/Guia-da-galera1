    mapaDesc: {
        pt: 'Organizamos os lugares por bairro. Um mapa interativo com coordenadas exatas está a caminho — por enquanto, use "Abrir no mapa" em cada lugar para ver a rota real.',
        en: 'We organized places by neighborhood. An interactive map with exact coordinates is on its way — for now, use "Open in maps" on each place to see the real route.',
        es: 'Organizamos los lugares por barrio. Un mapa interactivo con coordenadas exactas está en camino — por ahora, usa "Abrir en el mapa" en cada lugar para ver la ruta real.',
        zh: '我们按街区整理了这些地点。带精确坐标的互动地图即将上线——目前请点击每个地点的"在地图中打开"查看真实路线。',
        fr: 'Nous avons organisé les lieux par quartier. Une carte interactive avec coordonnées exactes arrive bientôt — en attendant, utilisez "Ouvrir sur la carte" sur chaque lieu pour voir le vrai trajet.', de: "Wir haben die Orte nach Stadtvierteln sortiert. Eine interaktive Karte mit genauen Koordinaten kommt bald — nutze bis dahin \"In Karten öffnen\" bei jedem Ort für die echte Route.", it: "Abbiamo organizzato i posti per quartiere. Una mappa interattiva con coordinate esatte sta arrivando — per ora usa \"Apri nelle mappe\" su ogni posto per vedere il percorso reale.", ja: "エリアごとに整理しています。正確な座標付きのインタラクティブ地図は近日公開予定です。今は各店舗の「地図で開く」から実際のルートをご確認ください。", ru: "Мы сгруппировали места по районам. Интерактивная карта с точными координатами скоро появится — пока используйте «Открыть на карте» у каждого места.", ar: "رتبنا الأماكن حسب الأحياء. خريطة تفاعلية بإحداثيات دقيقة قادمة قريبًا — استخدم في الوقت الحالي \"افتح في الخرائط\" لكل مكان لمعرفة الطريق الفعلي.", hi: "हमने जगहों को मोहल्ले के अनुसार व्यवस्थित किया है। सटीक निर्देशांक वाला इंटरैक्टिव मानचित्र जल्द आ रहा है — तब तक हर जगह पर \"मानचित्र में खोलें\" का उपयोग करें।"
    },
    footerTagline: { pt: "Comer, brincar, passear e curtir — tudo em um só lugar, em Bragança Paulista.", en: "Eat, play, explore and have fun — all in one place, in Bragança Paulista.", es: "Comer, jugar, pasear y disfrutar — todo en un solo lugar, en Bragança Paulista.", zh: "吃喝玩乐，尽在布拉甘萨保利斯塔一站式指南。", fr: "Manger, jouer, sortir et s'amuser — tout au même endroit, à Bragança Paulista.", de: "Essen, spielen, entdecken und Spaß haben — alles an einem Ort, in Bragança Paulista.", it: "Mangiare, giocare, passeggiare e divertirsi — tutto in un posto solo, a Bragança Paulista.", ja: "食べる、遊ぶ、出かける、楽しむ — ブラガンサ・パウリスタのすべてがここに。", ru: "Поесть, поиграть, погулять и повеселиться — всё в одном месте, в Браганса-Паулисте.", ar: "الأكل واللعب والتنزه والمرح — كل ذلك في مكان واحد، في براغانسا باوليستا.", hi: "खाना, खेलना, घूमना और मस्ती — सब एक ही जगह, ब्रागांसा पॉलिस्ता में।" },
    categorias: { pt: "Categorias", en: "Categories", es: "Categorías", zh: "分类", fr: "Catégories", de: "Kategorien", it: "Categorie", ja: "カテゴリ", ru: "Категории", ar: "الفئات", hi: "श्रेणियां" },
    sobreDados: { pt: "Sobre os dados", en: "About the data", es: "Sobre los datos", zh: "关于数据", fr: "À propos des données", de: "Über die Daten", it: "Sui dati", ja: "データについて", ru: "Об информации", ar: "عن البيانات", hi: "डेटा के बारे में" },
    sobreDadosTexto: {
        pt: 'Usamos apenas informações públicas que conseguimos confirmar (Google, redes sociais e sites oficiais). Quando algo não pode ser confirmado, avisamos claramente no lugar. Viu algo desatualizado? Use "Indicar um lugar".',
        en: 'We only use public information we could confirm (Google, social media and official websites). When something can\'t be confirmed, we clearly flag it. Spotted something outdated? Use "Suggest a place".',
        es: 'Solo usamos información pública que pudimos confirmar (Google, redes sociales y sitios oficiales). Cuando algo no se puede confirmar, lo indicamos claramente en el lugar. ¿Viste algo desactualizado? Usa "Recomendar un lugar".',
        zh: '我们只使用能够核实的公开信息（Google、社交媒体和官方网站）。若信息无法确认，会在页面上明确标注。发现过时信息？请使用"推荐一个地方"告诉我们。',
        fr: 'Nous utilisons uniquement des informations publiques que nous avons pu confirmer (Google, réseaux sociaux et sites officiels). Quand quelque chose ne peut pas être confirmé, nous le signalons clairement. Vous avez vu quelque chose d\'obsolète ? Utilisez "Suggérer un lieu".', de: "Wir verwenden nur öffentliche Informationen, die wir bestätigen konnten (Google, soziale Medien und offizielle Webseiten). Wenn etwas nicht bestätigt werden kann, weisen wir klar darauf hin. Etwas veraltet gesehen? Nutze \"Ort vorschlagen\".", it: "Usiamo solo informazioni pubbliche che abbiamo potuto verificare (Google, social e siti ufficiali). Quando qualcosa non può essere confermato, lo segnaliamo chiaramente. Hai visto qualcosa di non aggiornato? Usa \"Segnala un posto\".", ja: "確認できた公開情報（Google、SNS、公式サイト）のみを使用しています。確認できない情報は明示しています。情報が古い場合は「お店を提案する」からお知らせください。", ru: "Мы используем только公 проверенную публичную информацию (Google, соцсети и официальные сайты). Если что-то не удалось подтвердить, мы это отмечаем. Заметили неточность? Используйте «Предложить место».", ar: "نستخدم فقط المعلومات العامة التي تمكنّا من التحقق منها (جوجل ووسائل التواصل والمواقع الرسمية). وعندما يتعذر التأكد من شيء، نوضح ذلك. لاحظت معلومة قديمة؟ استخدم \"اقترح مكانًا\".", hi: "हम केवल वही सार्वजनिक जानकारी उपयोग करते हैं जिसकी पुष्टि हो सकी (Google, सोशल मीडिया और आधिकारिक वेबसाइट)। जो पुष्टि नहीं हो पाती, उसे स्पष्ट बताते हैं। कुछ पुराना दिखे? \"जगह सुझाएं\" का उपयोग करें।"
    },

function getOpenStatus(hoursStructured) {
    if (!hoursStructured)
        return null;
    try {
        const now = new Date(new Date().toLocaleString("en-US", { timeZone: "America/Sao_Paulo" }));
        const dayKey = DAY_KEYS[now.getDay()];
        const ranges = hoursStructured[dayKey];
        if (!ranges)
            return false;
        const minutes = now.getHours() * 60 + now.getMinutes();
        return ranges.some(([open, close]) => {
            const [oh, om] = open.split(":").map(Number);
            const [ch, cm] = close.split(":").map(Number);
            const openMin = oh * 60 + om;
            const closeMin = ch * 60 + cm;
            return minutes >= openMin && minutes <= closeMin;
        });
    }
    catch (_a) {
        return null;
    }
}

function galeraProfile(p) {
    const hay = norm([
        ...(p.positives || []),

        ...(p.subcats || []),
        ...(p.keywords || []),
        p.description || "",
        p.ageRange || "",

        try {
